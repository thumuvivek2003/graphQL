# schema.graphql

type Post {
  id: ID!
  title: String!
  content: String!
  createdAt: String!
}

type PostConnection {
  edges: [PostEdge]
  pageInfo: PageInfo
}

type PostEdge {
  node: Post
  cursor: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Query {
  getPosts(first: Int, after: String, last: Int, before: String): PostConnection
}
